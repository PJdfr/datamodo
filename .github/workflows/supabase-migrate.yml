name: Apply Supabase migrations

# Keeps the hosted database in step with the repo. Whenever migration files
# change on `dev` (the branch Vercel deploys), push them to the linked project
# so the dashboard never loads against a schema that's missing a migration.
on:
  push:
    branches: [dev]
    paths:
      - "supabase/migrations/**"
  workflow_dispatch: {}

# Never run two pushes against the same database at once.
concurrency:
  group: supabase-migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: dywkfirozofxyohqmxrn
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      # Show what will be applied (no-op if the DB is already up to date).
      - name: List pending migrations
        run: supabase migration list

      - name: Push migrations
        run: supabase db push
