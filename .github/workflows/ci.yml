# CI — the project's verification bar (docs/STATE.md), enforced on every PR:
# unit tests on pure cores, tsc clean, lint == baseline, `next build` green.
name: CI

on:
  pull_request:
  push:
    branches: [dev, prod]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Dummy values so `next build` can collect page data (auth/prisma read
      # these at module scope). Nothing connects during a build.
      DATABASE_URL: postgresql://user:pass@localhost:5432/db
      NEON_AUTH_BASE_URL: https://example.neon.auth
      NEON_AUTH_COOKIE_SECRET: dummy-secret-for-ci-0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint (== baseline)
        run: node scripts/check-lint-baseline.mjs
      - name: Build
        run: npm run build
