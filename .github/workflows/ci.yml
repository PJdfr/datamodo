name: CI

on:
  pull_request:
  push:
    branches: [prod]

jobs:
  # Applies every migration + seed.sql to a throwaway local Postgres. This is the
  # "never lose user data" gate: a migration that fails to apply cleanly (or a
  # seed that no longer matches the schema) fails the PR before it can reach prod.
  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start local stack
        run: supabase start
      - name: Apply all migrations + seed
        run: supabase db reset --no-seed=false

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
        env:
          # next build only needs these to be present, not real.
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci
