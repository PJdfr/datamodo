name: Extraction cron

# Drives the extraction queue on Neon (no pgmq/pg_cron). Every run pings the
# Vercel consumer, which claims a batch of stored items (SKIP LOCKED) and runs
# extraction. GitHub Actions' minimum schedule granularity is ~5 minutes and
# runs may be delayed under load — fine for an individual product; raise
# throughput with a larger EXTRACT_BATCH or an internal drain loop later.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

# Don't let a slow/late run pile up on the next one.
concurrency:
  group: extract-cron
  cancel-in-progress: false

jobs:
  drain:
    runs-on: ubuntu-latest
    # CRON_SECRET = repository secret, APP_URL = repository variable.
    steps:
      - name: Ping extraction consumer (all environments)
        run: |
          if [ -z "${CRON_SECRET}" ]; then
            echo "CRON_SECRET not set — skipping."; exit 0
          fi
          # Tick BOTH environments: APP_URL (prod, secret) and the public dev
          # domain. One failing env must not stop the other's drain.
          fail=0
          for url in ${APP_URL} https://www.datamodo.dev; do
            echo "tick ${url}"
            curl -fsS --max-time 90 -X POST "${url%/}/api/jobs/extract-tick" \
              -H "Authorization: Bearer ${CRON_SECRET}" || fail=1
            echo
          done
          exit ${fail}
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
