<!-- @template name="Datamodo App" description="Signed-in app shell — auth (login/register) into a dashboard with switchable sheet tables" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Datamodo — App</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--dm-canvas-alt); font-family: var(--dm-font-body); color: var(--dm-ink); -webkit-font-smoothing: antialiased; }
  a { color: var(--dm-accent); text-decoration: none; } a:hover { color: var(--dm-accent-press); }
  ::selection { background: var(--dm-selection); color: var(--dm-ink); }
  @keyframes dm-floaty { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
  @keyframes dm-flash { 0%,14%{background:#F8CDBC} 60%{background:var(--dm-accent-tint-2)} 100%{background:var(--dm-accent-tint-2)} }
  @media (prefers-reduced-motion: reduce){ *{animation:none!important} }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="app.jsx"></script>
</body>
</html>
